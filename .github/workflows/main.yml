name: Build & Test
on:
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    paths-ignore:
    - '**.md'
  workflow_dispatch: # Add manual trigger
jobs:
  Test:
    runs-on: ubuntu-latest  # Changed from self-hosted
    timeout-minutes: 30
    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    - name: Set up JDK 8  # Add JDK setup
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Setup Android SDK  # Add Android SDK setup
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for build script  # Add execute permission
      run: chmod +x ./build.sh

    - name: Build project
      run: ./build.sh build

    - name: Run Android tests
      run: ./build.sh android-tests-parallel 28 29 30 32 33 34

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: |
          build/*log
          uhabits-android/build/outputs
