name: Build & Release APK
on:
  push:
    branches: [ group_separate ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build debug APK
      run: ./gradlew :uhabits-android:assembleDebug --stacktrace

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: build-${{ steps.date.outputs.date }}
        release_name: uhabits with Groups - ${{ steps.date.outputs.date }}
        body: |
          🎉 **uhabits with Habit Groups Feature**
          
          This is an unofficial build of uhabits with the habit grouping feature from PR #2020.
          
          **Features:**
          - All original uhabits features
          - ✨ New: Organize habits into groups
          - Based on dharux's group_separate branch
          
          **Known Issues:**
          - Editing habits within groups may crash (remove from group → edit → re-add as workaround)
          
          Install the APK below on your Android device.
        draft: false
        prerelease: true

    - name: Upload APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: uhabits-android/build/outputs/apk/debug/uhabits-android-debug.apk
        asset_name: uhabits-groups-debug.apk
        asset_content_type: application/vnd.android.package-archive
